---
- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/odoo/scripts
    - /opt/odoo/backups/logs

- name: Copy backup.sh
  copy:
    src: backup.sh
    dest: /opt/odoo/scripts/backup.sh
    owner: deploy
    mode: "0750"

- name: Copy db-replicate.sh
  copy:
    src: db-replicate.sh
    dest: /opt/odoo/scripts/db-replicate.sh
    owner: deploy
    mode: "0750"

- name: Create logfile
  file:
    path: /opt/odoo/backups/logs/odoo-backup.log
    state: touch
    owner: deploy
    mode: "0644"

- name: Cronjob for nightly backup
  cron:
    name: "odoo nightly backup"
    minute: "0"
    hour: "2"
    job: "/opt/odoo/scripts/backup.sh >> /opt/odoo/backups/logs/odoo-backup.log 2>&1"
    user: deploy
