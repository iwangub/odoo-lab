---
- name: Clone odoo-lab repo
  become: true
  ansible.builtin.git:
    repo: https://github.com/iwangub/odoo-lab.git
    dest: /opt/odoo
    version: 18.0-dev
    force: false

- name: Create directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/odoo/scripts
    - /opt/odoo/backups/logs

- name: Copy backup.sh
  become: true
  copy:
    src: backup.sh
    dest: /opt/odoo/scripts/backup.sh
    owner: deploy
    mode: "0750"

- name: Copy db-replicate.sh
  become: true
  copy:
    src: db-replicate.sh
    dest: /opt/odoo/scripts/db-replicate.sh
    owner: deploy
    mode: "0750"