services:
  odoo_dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8069:8069"
    volumes:
      - odoo_data_dev:/var/lib/odoo
      - ./addons/worklog:/mnt/extra-addons/worklog
    environment:
      HOST: db_dev
      USER: odoo
      PASSWORD: odoo
    depends_on:
      db_dev:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - odoo-dev-net

  db_dev:
    image: postgres:14
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U odoo" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - odoo-dev-net

volumes:
  odoo_data_dev:
  db_data_dev:

networks:
  odoo-dev-net:
