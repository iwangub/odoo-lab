name: Deploy Prod

on:
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/private_key
          chmod 600 /tmp/private_key

      - name: Deploy via SSH
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no \
            deploy@${{ secrets.STAGING_HOST }} \
            'cd /opt/odoo && docker compose pull odoo && docker compose up -d --no-deps --force-recreate odoo'

      - name: Update Worklog module
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no \
            deploy@${{ secrets.STAGING_HOST }} \
            'cd /opt/odoo && docker compose run --rm odoo odoo -u worklog --stop-after-init --no-http'

      - name: Health check
        run: |
          sleep 40
          curl -f https://odoo.dev-lab.dev/web/health || exit 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/private_key
