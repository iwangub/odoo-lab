name: CI

on:
  push:
    branches: [18.0-dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check addons/

  test:
    needs: lint
    name: Test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t worklog-test -f docker/Dockerfile .

      - name: Run Odoo module tests
        run: |
          docker run --rm \
            --network host \
            -e HOST=localhost \
            -e USER=odoo \
            -e PASSWORD=odoo \
            worklog-test \
            odoo --test-enable --test-tags /worklog -i worklog \
                 -d odoo_test --stop-after-init --log-level=test
